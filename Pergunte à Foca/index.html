<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunte à Foca!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="conteudo">
        <h1>Pergunte à Foca!</h1>
        <p class="subtitulo">Em dúvida entre duas coisas? A foca decide!</p>

        <div class="foca">
            <img src="foca.svg" alt="Foca da CJR" class="svg-foca">

            <div class="olhos">
                <div class="olho"><div class="pupila"></div></div>
                <div class="olho"><div class="pupila"></div></div>
            </div>
        </div>

        <p class="resposta">Escreva as duas opções:</p>

        <div class="opcoes">
            <input type="text" class="opcao opcao1" placeholder="Primeira opção">
            <span class="ou">ou</span>
            <input type="text" class="opcao opcao2" placeholder="Segunda opção">
        </div>

        <div class="botoes">
            <button type="button" class="botao-perguntar">Perguntar à Foca!</button>
            <button type="button" class="botao-certeza escondido">Tem certeza?</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
