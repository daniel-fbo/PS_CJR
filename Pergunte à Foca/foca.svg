<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Foca desenhada de frente no mesmo tamanho da div .foca (300x300).
       Os olhos NAO estao no desenho: eles vem do HTML/CSS e caem em
       x=115 e x=185, y=110, que e onde ficam as manchas escuras abaixo. -->

  <!-- nadadeiras de baixo -->
  <ellipse cx="55" cy="275" rx="45" ry="16" fill="#8a949f" transform="rotate(-15 55 275)"/>
  <ellipse cx="245" cy="275" rx="45" ry="16" fill="#8a949f" transform="rotate(15 245 275)"/>

  <!-- corpo e barriga -->
  <ellipse cx="150" cy="245" rx="105" ry="65" fill="#a4adb8"/>
  <ellipse cx="150" cy="258" rx="65" ry="42" fill="#d9dee4"/>

  <!-- nadadeiras da frente -->
  <ellipse cx="62" cy="235" rx="16" ry="38" fill="#8a949f" transform="rotate(25 62 235)"/>
  <ellipse cx="238" cy="235" rx="16" ry="38" fill="#8a949f" transform="rotate(-25 238 235)"/>

  <!-- cabeca -->
  <circle cx="150" cy="125" r="85" fill="#b8c0c9"/>

  <!-- manchas do pelo -->
  <circle cx="95" cy="75" r="6" fill="#8a949f"/>
  <circle cx="110" cy="60" r="4" fill="#8a949f"/>
  <circle cx="205" cy="80" r="5" fill="#8a949f"/>
  <circle cx="215" cy="150" r="4" fill="#8a949f"/>
  <circle cx="200" cy="230" r="6" fill="#8a949f"/>
  <circle cx="95" cy="225" r="5" fill="#8a949f"/>

  <!-- manchas escuras em volta de onde os olhos do CSS ficam -->
  <circle cx="115" cy="110" r="26" fill="#8a949f"/>
  <circle cx="185" cy="110" r="26" fill="#8a949f"/>

  <!-- focinho -->
  <ellipse cx="130" cy="165" rx="26" ry="20" fill="#e6eaee"/>
  <ellipse cx="170" cy="165" rx="26" ry="20" fill="#e6eaee"/>
  <ellipse cx="150" cy="148" rx="13" ry="9" fill="#001a31"/>
  <path d="M150 157 L150 168 M150 168 Q140 178 130 170 M150 168 Q160 178 170 170"
        stroke="#001a31" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- bigodes -->
  <g stroke="#6b7580" stroke-width="2" stroke-linecap="round">
    <line x1="112" y1="162" x2="70" y2="152"/>
    <line x1="112" y1="168" x2="68" y2="170"/>
    <line x1="112" y1="174" x2="72" y2="188"/>
    <line x1="188" y1="162" x2="230" y2="152"/>
    <line x1="188" y1="168" x2="232" y2="170"/>
    <line x1="188" y1="174" x2="228" y2="188"/>
  </g>

  <!-- lencinho verde da CJR -->
  <path d="M88 198 Q150 228 212 198" stroke="#26bd82" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M170 212 L192 240 L200 208 Z" fill="#26bd82"/>
</svg>
